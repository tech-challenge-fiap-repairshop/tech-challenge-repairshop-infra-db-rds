name: 🚀 AWS DB RDS Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ 'main', 'homolog', 'dev', 'develop' ]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-cd-db-rds.yml'
  pull_request:
    branches: [ 'main', 'homolog', 'dev', 'develop' ]
    paths:
      - 'infra/**'
      - '.github/workflows/ci-cd-db-rds.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Deploy (prd, dev, hml)'
        required: true
        default: 'prd'
        type: choice
        options:
          - prd
          - dev
          - hml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: "🚀 Build, Test & Deploy (AWS DB RDS)"
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[skip-ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: >-
      ${{ 
        github.event.inputs.environment || 
        (github.base_ref == 'main' && 'prd') || 
        (github.ref == 'refs/heads/main' && 'prd') || 
        (github.base_ref == 'homolog' && 'hml') || 
        (github.ref == 'refs/heads/homolog' && 'hml') || 
        'dev' 
      }}
    permissions:
      contents: read

    env:
      ENV: >-
        ${{ 
          github.event.inputs.environment || 
          (github.base_ref == 'main' && 'prd') || 
          (github.ref == 'refs/heads/main' && 'prd') || 
          (github.base_ref == 'homolog' && 'hml') || 
          (github.ref == 'refs/heads/homolog' && 'hml') || 
          'dev' 
        }}
      TF_VAR_db_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      TF_VAR_db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 Bucket for Terraform State exists
        run: |
          BUCKET_NAME="fiap-repairshop2"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME já existe."
          else
            echo "Bucket $BUCKET_NAME não existe. Criando..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'
            aws s3api put-public-access-block --bucket "$BUCKET_NAME" --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'
          fi

      - name: Check Remote Network State Existence
        id: check_network_state
        run: |
          NETWORK_KEY="network/${ENV}.tfstate"
          BUCKET_NAME="fiap-repairshop2"
          
          if aws s3api head-object --bucket "$BUCKET_NAME" --key "$NETWORK_KEY" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Estado da rede ($NETWORK_KEY) encontrado no bucket $BUCKET_NAME."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Estado da rede ($NETWORK_KEY) NÃO encontrado no bucket $BUCKET_NAME."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check

      - name: Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=fiap-repairshop2" \
            -backend-config="key=rds/${ENV}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate / Plan
        run: |
          cd infra
          if [ "${{ steps.check_network_state.outputs.exists }}" = "true" ]; then
            echo "🔍 Executando terraform plan com environments/${ENV}.tfvars..."
            terraform plan -var-file="environments/${ENV}.tfvars"
          else
            echo "::warning::O estado remoto da rede 'network/${ENV}.tfstate' ainda não existe no S3. Executando 'terraform validate' para validação sintática do PR."
            terraform validate
          fi

      - name: Terraform Apply (Somente na branch main ou disparo manual)
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          cd infra
          if [ "${{ steps.check_network_state.outputs.exists }}" != "true" ]; then
            echo "::error::Não é possível executar o deploy do RDS porque o estado remoto da rede 'network/${ENV}.tfstate' não foi encontrado no S3. Execute o deploy do repositório 'infra-network' para '${ENV}' primeiro!"
            exit 1
          fi
          terraform apply -auto-approve -var-file="environments/${ENV}.tfvars"

      - name: Generate Pipeline Summary
        if: always()
        run: |
          echo "## 🚀 AWS DB RDS CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente Alvo** | \`${{ env.ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Evento** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Autor** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Execução** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
