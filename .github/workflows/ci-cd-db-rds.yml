name: 🚀 AWS DB RDS Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ 'main', 'homolog', 'develop' ]
    paths:
      - 'dev/**'
      - 'hml/**'
      - 'prd/**'
      - '.github/workflows/ci-cd-db-rds.yml'
  pull_request:
    branches: [ 'main', 'homolog', 'develop' ]
    paths:
      - 'dev/**'
      - 'hml/**'
      - 'prd/**'
      - '.github/workflows/ci-cd-db-rds.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Deploy (prd, dev, hml)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: "🚀 Build, Test & Deploy (AWS DB RDS)"
    if: |
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[skip-ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ENV: >-
        ${{ 
          github.event.inputs.environment || 
          (github.ref == 'refs/heads/main' && 'prd') || 
          (github.ref == 'refs/heads/homolog' && 'hml') || 
          'dev' 
        }}
      TF_VAR_db_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      TF_VAR_db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 Bucket for Terraform State exists
        run: |
          BUCKET_NAME="fiap-repairshop2"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME já existe."
          else
            echo "Bucket $BUCKET_NAME não existe. Criando..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'
            aws s3api put-public-access-block --bucket "$BUCKET_NAME" --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        run: |
          cd ${{ env.ENV }}
          terraform init

      - name: Terraform Plan
        run: |
          cd ${{ env.ENV }}
          terraform plan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/develop'))
        run: |
          cd ${{ env.ENV }}
          terraform apply -auto-approve
